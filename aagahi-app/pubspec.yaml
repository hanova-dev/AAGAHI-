name: aagahi
description: AAGAHI - flash-drought early warning for smallholder farmers.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management. Chosen over Provider/BLoC for compile-time-safe
  # dependency wiring and testability without a widget harness.
  flutter_riverpod: ^2.5.1

  # Functional error handling. Repositories return Either<Failure, T> so a
  # failure can never be silently swallowed into a null.
  dartz: ^0.10.1
  equatable: ^2.0.5

  # Local persistence. Drift over raw sqflite for type-safe queries;
  # sqlcipher_flutter_libs supplies encryption at rest (NFR-SEC-002).
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.20
  sqlcipher_flutter_libs: ^0.6.1
  path_provider: ^2.1.3
  path: ^1.9.0

  # Secure key storage, backed by Android Keystore / iOS Keychain.
  flutter_secure_storage: ^9.2.2

  # Networking with certificate pinning support (NFR-SEC-001, CI-02).
  dio: ^5.4.3+1

  # Offline queue scheduling without wake locks (FR-SYNC-009).
  workmanager: ^0.5.2
  connectivity_plus: ^6.0.3

  # Voice: explicit push-to-talk only, never voice activity detection (CON-09).
  # ^7.4.0, not ^6.6.2: 6.x pulls a `js` version that conflicts with
  # flutter_secure_storage ^9.2.2's web dependency (verified via `flutter pub
  # get` against the installed SDK).
  speech_to_text: ^7.4.0
  flutter_tts: ^4.0.2
  just_audio: ^0.9.38

  # Pinned to match the version flutter_localizations resolves to on the
  # installed SDK (verified via `flutter pub get`) - a looser ^0.19.0
  # constraint fails dependency resolution outright.
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4
  drift_dev: ^2.18.0
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
  fonts:
    - family: NotoNastaliqUrdu
      fonts:
        - asset: assets/fonts/NotoNastaliqUrdu-Regular.ttf
        - asset: assets/fonts/NotoNastaliqUrdu-Bold.ttf
          weight: 700
