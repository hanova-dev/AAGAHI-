name: aagahi
description: AAGAHI - flash-drought early warning for smallholder farmers.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management. Chosen over Provider/BLoC for compile-time-safe
  # dependency wiring and testability without a widget harness.
  flutter_riverpod: ^2.5.1

  # Functional error handling. Repositories return Either<Failure, T> so a
  # failure can never be silently swallowed into a null.
  dartz: ^0.10.1
  equatable: ^2.0.5

  # Local persistence. Drift over raw sqflite for type-safe queries.
  # Encryption at rest (NFR-SEC-002) comes from sqlite3's own SQLCipher
  # build, selected below via `hooks.user_defines` - NOT sqlcipher_flutter_libs,
  # which sqlite3's own upgrade guide says is "no longer necessary after
  # upgrading to drift 2.32.0" and whose runtime open.overrideFor/
  # OperatingSystem API no longer exists in sqlite3 3.x at all (verified via
  # `flutter analyze`: the import doesn't resolve). sqlite3_flutter_libs is
  # obsolete for the same reason and was already removed earlier.
  drift: ^2.18.0
  sqlite3: ^3.4.0
  path_provider: ^2.1.3
  path: ^1.9.0

  # Secure key storage, backed by Android Keystore / iOS Keychain.
  flutter_secure_storage: ^9.2.2

  # Networking with certificate pinning support (NFR-SEC-001, CI-02).
  dio: ^5.4.3+1

  # Offline queue scheduling without wake locks (FR-SYNC-009).
  # ^0.10.9, not ^0.5.2: 0.5.x is written against Flutter's v1 Android
  # embedding, which no longer exists - it fails to compile at all on the
  # current Flutter/AGP toolchain (verified via `flutter run`).
  workmanager: ^0.10.9
  connectivity_plus: ^6.0.3

  # Voice: explicit push-to-talk only, never voice activity detection (CON-09).
  # ^7.4.0, not ^6.6.2: 6.x pulls a `js` version that conflicts with
  # flutter_secure_storage ^9.2.2's web dependency (verified via `flutter pub
  # get` against the installed SDK).
  speech_to_text: ^7.4.0
  flutter_tts: ^4.0.2
  just_audio: ^0.9.38

  # Pinned to match the version flutter_localizations resolves to on the
  # installed SDK (verified via `flutter pub get`) - a looser ^0.19.0
  # constraint fails dependency resolution outright.
  intl: ^0.20.2

  # Charts (D2's 14-day trace). Per CLAUDE.md's package table: no chart
  # package draws a trace inside a gauge arc, which is why RiskRing stays a
  # hand-rolled CustomPainter, but a plain line chart is exactly what
  # fl_chart is for - a second hand-rolled CustomPainter here would be the
  # "stop and justify it" case the same rule warns about.
  fl_chart: ^0.69.0

  # Client-generated report IDs (flow F): a field report is created offline
  # and must be able to name itself before any server has seen it. A
  # correct v4 UUID (version/variant bits set right) is exactly the kind of
  # small thing not worth hand-rolling.
  uuid: ^4.4.0

  # F4's photo picker (gallery + camera). No custom platform channel: this
  # is the standard, maintained way to reach both sources from Flutter.
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4
  drift_dev: ^2.18.0
  build_runner: ^2.4.11

# Selects the SQLCipher-enabled sqlite3 build at compile time via Dart's
# native build hooks, replacing the deprecated sqlcipher_flutter_libs
# package (NFR-SEC-002). See core/database/app_database.dart.
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
  fonts:
    - family: NotoNastaliqUrdu
      fonts:
        - asset: assets/fonts/NotoNastaliqUrdu-Regular.ttf
        - asset: assets/fonts/NotoNastaliqUrdu-Bold.ttf
          weight: 700
