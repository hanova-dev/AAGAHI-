org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Kotlin's incremental compiler computes a relative path between the pub
# cache (plugin sources, e.g. flutter_tts) and this project. On Windows,
# when the two live on different drive letters, that relativisation throws
# ("this and base files have different roots") and the daemon compilation
# fails outright. Non-incremental compilation is slower but correct; this is
# an environment-specific workaround, not a project setting to remove later
# on a single-drive machine, so it is deliberately not made conditional.
kotlin.incremental=false
