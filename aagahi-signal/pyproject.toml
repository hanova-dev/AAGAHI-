[project]
name = "aagahi-signal"
version = "0.1.0"
description = "AAGAHI flash-drought rate-of-decline signal pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "earthengine-api==1.4.3",
    "pandas==2.2.3",
    "numpy==2.1.3",
    "matplotlib==3.9.2",
    "pyarrow==18.1.0",
    "scikit-learn==1.5.2",
    "lightgbm==4.5.0",
    "shap==0.46.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aagahi_signal*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
